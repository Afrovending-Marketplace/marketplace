# Manual checks (lint + production build). Does not deploy. Add "pull_request:" later if you want it automatic.
name: CI checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff && ruff check backend/afrovending backend/server.py --select F,E9
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn build
        working-directory: frontend
        env: { REACT_APP_BACKEND_URL: "https://staging.afrovending.com", REACT_APP_SHOW_SAMPLE_CATALOG: "false", CI: "false" }
