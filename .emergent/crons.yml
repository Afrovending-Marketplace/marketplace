crons:
  - name: low-stock-digest
    description: "Emails vendors who chose the weekly option a summary of all their low-stock items (Mondays 9am UTC)"
    cron: "0 9 * * 1"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/low-stock-digest"
    method: POST
    enabled: true
  - name: payout-release
    description: "Daily: records Stripe fees and releases vendor earnings that passed the hold period (simulated accounts until Connect is enabled)"
    cron: "0 10 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/payout-release"
    method: POST
    enabled: true
  - name: ops-tick
    description: "Every 15 min: health check, abandoned carts; hourly escalations, handling alerts and 9am ET wishlist summary"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/ops-tick"
    method: POST
    enabled: true
