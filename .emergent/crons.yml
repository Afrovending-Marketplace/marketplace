crons:
  - name: low-stock-digest
    description: "Emails vendors who chose the weekly option a summary of all their low-stock items (Mondays 9am UTC)"
    cron: "0 9 * * 1"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/low-stock-digest"
    method: POST
    enabled: true
  - name: payout-release
    description: "Daily: records Stripe fees and releases vendor earnings that passed the hold period (test mode; simulated accounts until Connect is enabled)"
    cron: "0 10 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/payout-release"
    method: POST
    enabled: true
  - name: fulfillment-escalations
    description: "Hourly: flags cancellation/return requests past the vendor response deadline and notifies admins"
    cron: "15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/fulfillment-escalations"
    method: POST
    enabled: true
  - name: handling-alerts
    description: "Hourly: vendor reminders before handling deadlines, customer/vendor overdue emails, admin escalation after the configured threshold (each sent once)"
    cron: "45 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/handling-alerts"
    method: POST
    enabled: true
  - name: abandoned-carts
    description: "Every 15 min: abandoned-cart reminders (1h and 24h) for opted-in customers only; does nothing while the admin switch is off"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/abandoned-carts"
    method: POST
    enabled: true
  - name: wishlist-alerts
    description: "Daily 9:00 AM US Eastern: one wishlist summary (price drops >= threshold, back in stock) per opted-in shopper; does nothing while the admin switch is off"
    cron: "0 9 * * *"
    timezone: "America/New_York"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/v1/cron/wishlist-alerts"
    method: POST
    enabled: true
